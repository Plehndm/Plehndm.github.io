- title: Research Assistant — Bayesian Cognitive Modeling Lab
  org: Prof. Michael D. Lee · UC Irvine
  location: Irvine, CA
  dates: Oct 2026 – Present
  status: ACTIVE
  summary: >-
    Bayesian cognitive modeling of expertise to improve wisdom-of-the-crowd
    aggregation.
  points:
    - Building a Bayesian Rasch (ability/difficulty) latent-truth model in JAGS that weights individual judgments by each person's inferred expertise, using the Bennett, Benjamin, Mistry & Steyvers (2018) dataset
    - Extending the model from a single holistic expertise parameter to per-topic ability and difficulty parameters so it can represent multidimensional expertise across knowledge domains
    - Surveying datasets in the lab's behavioral data repository to determine how existing cognitive models must be adapted to capture domain-specific expertise

- title: Research Assistant — Learning and Decision Neuroscience Lab
  org: Prof. Mimi Liljeholm · UC Irvine
  location: Irvine, CA
  dates: Oct 2026 – Present
  status: ACTIVE
  summary: >-
    Deep reinforcement learning models of observational and social learning,
    part of the lab's Agentic AI Experiment.
  points:
    - Combining the neural model of observational learning in Liljeholm, Molloy & O'Doherty (2012, J Neurosci) with the imitation-based social conformity model in Mauter & Liljeholm (2026, Brain and Behavior) into a single deep RL project
    - Implementing observational Q-learning agents to compare imitation (copying actions) with emulation (inferring others' goals) as mechanisms of social learning
    - Training RL agents in MiniGrid environments to test instrumental control (outcome divergence) as an intrinsic reward surrogate

